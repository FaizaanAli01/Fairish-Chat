# ==============================================================================
# Fairish Chat frontend — Nginx configuration for the unprivileged image
# ==============================================================================
# This file is copied to /etc/nginx/conf.d/default.conf in the runtime image.
# The container runs as the unprivileged "nginx" user (UID 101), so it listens
# on port 8080 and never needs to bind a privileged port.
# ==============================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact Nginx version in responses or error pages.
    server_tokens off;

    # Static assets only; no request body should ever be large.
    client_max_body_size 1m;

    # --------------------------------------------------------------------------
    # Security headers
    # --------------------------------------------------------------------------
    # CSP notes:
    #  - style-src allows 'unsafe-inline' because the SPA sets inline style
    #    attributes (Tailwind/React). script-src stays strict.
    #  - connect-src permits HTTPS/WSS so the API can live on a different origin
    #    (Render) from the static site (Vercel/Docker).
    #  - upgrade-insecure-requests is intentionally omitted so local HTTP
    #    deployments keep working; Vercel enforces HTTPS and adds it there.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Only honoured by browsers over HTTPS; harmless when TLS terminates upstream.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --------------------------------------------------------------------------
    # Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # --------------------------------------------------------------------------
    # Health endpoint for Docker/Compose health checks
    # --------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --------------------------------------------------------------------------
    # Hashed build assets: safe to cache for a long time.
    # Uses the "expires" directive (not add_header) so the security headers
    # declared at server level are still inherited.
    # --------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deploy is picked up.
    location = /index.html {
        expires -1;
    }

    # SPA routing: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
