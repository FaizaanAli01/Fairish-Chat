name: Fairish Chat Continuous Integration

on:
  push:
    branches: [ "main", "production-hardening" ]
  pull_request:
    branches: [ "main", "production-hardening" ]

jobs:
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests
        working-directory: ./backend
        run: mvn clean test -B

      - name: Package executable JAR
        working-directory: ./backend
        run: mvn -B -DskipTests package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/fairish-chat-backend-*.jar
          if-no-files-found: error

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck TypeScript
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Production Vite Build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://api.fairish.chat/api
          VITE_WS_URL: wss://api.fairish.chat/ws
        run: npm run build

  docker-build:
    name: Docker Image & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production compose file
        env:
          MONGODB_URI: mongodb://localhost:27017/fairish_chat
          JWT_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-secret
          MESSAGE_ENCRYPTION_KEY: Y2ktb25seS1ub3QtYS1yZWFsLWtleS0zMi1ieXRlcyE=
          CORS_ALLOWED_ORIGINS: https://app.example.com
          VITE_API_BASE_URL: https://api.example.com/api
          VITE_WS_URL: wss://api.example.com/ws
        run: docker compose -f docker-compose.prod.yml config > /dev/null

      - name: Build backend image
        run: docker build -t fairish-backend:ci ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://api.example.com/api \
            --build-arg VITE_WS_URL=wss://api.example.com/ws \
            -t fairish-frontend:ci ./frontend
