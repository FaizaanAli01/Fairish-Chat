server:
  port: ${PORT:8080}

spring:
  application:
    name: fairish-chat-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/fairish_chat}
      database: ${MONGODB_DATABASE:fairish_chat}
      auto-index-creation: false

app:
  jwt:
    # Development secret only. IN PRODUCTION: override with JWT_SECRET environment variable (minimum 256 bits).
    secret: ${JWT_SECRET:FAIRISH_CHAT_DEV_ONLY_INSECURE_SECRET_CHANGE_IN_PRODUCTION_KEY_1234567890_ABCDEF}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173,http://127.0.0.1:5173}

logging:
  level:
    root: INFO
    com.fairish.chat: DEBUG
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO
