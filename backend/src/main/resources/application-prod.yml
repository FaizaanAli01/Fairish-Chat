spring:
  config:
    activate:
      on-profile: prod

server:
  # Trust X-Forwarded-* headers when deployed behind a reverse proxy / load balancer.
  forward-headers-strategy: framework
  # Never leak exception details or binding errors to clients.
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

app:
  cors:
    # Production requires an explicit, comma-separated list of exact frontend origins.
    # No localhost defaults are applied in the prod profile.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: INFO
    com.fairish.chat: INFO
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO
