spring:
  config:
    activate:
      on-profile: prod

server:
  # Forwarded headers are NOT trusted implicitly. Client IP resolution for rate
  # limiting is performed by ClientIpResolver, which only reads
  # X-Forwarded-For when the immediate peer is listed in TRUSTED_PROXIES.
  forward-headers-strategy: none
  # Never leak exception details or binding errors to clients.
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

app:
  cors:
    # Production requires an explicit, comma-separated list of exact frontend origins.
    # No localhost defaults are applied in the prod profile.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  avatar:
    storage:
      # Cloudflare R2: virtual-hosted style, automatic region, bucket provisioned
      # out of band. The endpoint must be supplied via AVATAR_STORAGE_ENDPOINT.
      # Production defaults to enabled and refuses to start without credentials.
      enabled: ${AVATAR_STORAGE_ENABLED:true}
      region: ${AVATAR_STORAGE_REGION:auto}
      path-style-access: false
      create-bucket: false

logging:
  level:
    root: INFO
    com.fairish.chat: INFO
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO
